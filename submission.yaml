submission:
  title: "ReguLens"                           # REQUIRED

  problem_statement: >                         # REQUIRED
    ** Drug Safety Signal Detector & Regulatory Submission Readiness Checker**
    Pharmacovigilance and regulatory-affairs teams must review large safety
    datasets and CTD dossiers manually, making it difficult to identify
    potential signals, trace evidence, and prioritise missing submission content.

  solution_summary: >                          # REQUIRED
    ReguLens provides a two-mode regulatory intelligence workspace: Mode 1
    analyses FAERS safety data, while Mode 2 extracts CTD evidence and compares
    applicant dossiers against curated ICH requirements to produce traceable readiness reports.

  key_features:                                # REQUIRED
    - "FAERS safety-signal analysis with cleaning, PRR calculation, clustering, and review"
    - "Section-aware CTD PDF ingestion with source-page provenance"
    - "ICH requirement matching with present, partial, and missing evidence classification"
    - "Readiness, module, evidence, and prioritised gap reports"
    - "Hybrid evidence retrieval using embeddings, keywords, and CTD-section alignment"

  tech_stack:
    languages: ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React", "Vite"]
    ibm_technologies: ["IBM Bob", "IBM Docling"]
    databases: ["MongoDB Atlas", "PostgreSQL"]
    other: ["SentenceTransformers", "PyMuPDF", "scikit-learn", "GitHub Actions"]

  what_we_are_most_proud_of: >
    ReguLens provides end-to-end evidence traceability: users can move from a
    safety dataset or CTD PDF to an interpretable result, inspect supporting
    evidence, and prioritise the next regulatory action.

  known_limitations: >
    Authentication and production-grade role-based access control are not
    implemented. Results support evidence review and prioritisation but are not
    a substitute for qualified regulatory review or a submission decision.

